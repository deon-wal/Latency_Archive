<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>THE LATENCY ARCHIVE</title>
    <style>
        body { background: #0c0d0e; color: #e2e8f0; font-family: 'Courier New', monospace; padding: 50px; }
        .container { max-width: 800px; margin: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #444; padding: 10px; text-align: left; }
    </style>
</head>
<body>
    <div class="container">
        <h1>[ THE LATENCY ARCHIVE ]</h1>
        <section id="manifest-sector">
            <h2>👥 Character Manifest</h2>
            <table>
                <thead><tr><th>Character</th><th>Role</th><th>Profile</th></tr></thead>
                <tbody id="table-body">
                    </tbody>
            </table>
        </section>
    </div>

    <script>
        const manifest = [
            { name: "Vance", role: "Agent", profile: "Frayed, hollowed eyes." },
            { name: "Coordinator Caso", role: "Anchor", profile: "Cinematic perfection." },
            { name: "Finch", role: "Corruption", profile: "Erratic, ghost images." }
        ];

        const tbody = document.getElementById('table-body');
        tbody.innerHTML = manifest.map(c => 
            `<tr><td>${c.name}</td><td>${c.role}</td><td>${c.profile}</td></tr>`
        ).join('');
    </script>
</body>
</html>
