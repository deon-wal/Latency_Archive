<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE LATENCY ARCHIVE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="system-nav">
        <span class="nav-title">SYS.LOC // SECTOR-04</span>
        <button onclick="window.location.reload()">PURGE MEM</button>
    </nav>

    <div class="container">
        <header>
            <h1>[ THE LATENCY ARCHIVE ]</h1>
        </header>

        <section id="manifest-sector">
            <h2>👥 Character Manifest</h2>
            <table id="manifest-table">
                <thead><tr><th>Character</th><th>Role</th><th>Profile</th></tr></thead>
                <tbody></tbody>
            </table>
        </section>

        <div class="terminal-interface" id="terminal-interface">
            <div class="terminal-output" id="output-screen">System Initialized. Type 'manifest' to load data.</div>
            <div class="terminal-input-row">
                <span class="terminal-prompt">SYSTEM@CORE:></span>
                <input type="text" id="terminal-command" autofocus autocomplete="off">
            </div>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
